image: node:22-bullseye

variables:
  PNPM_HOME: "/root/.local/share/pnpm"
  PATH: "$PNPM_HOME:$PATH"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store
    - node_modules/

stages:
  - setup
  - test
  - report

install-dependencies:
  stage: setup
  script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile

e2e-tests:
  stage: test
  parallel: 2
  script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm --filter @qa-hub/playwright-tests exec playwright install --with-deps chromium
    - pnpm --filter @qa-hub/playwright-tests exec playwright test --shard=$CI_NODE_INDEX/$CI_NODE_TOTAL
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - artifact/
    reports:
      junit: artifact/reports/junit-results.xml
