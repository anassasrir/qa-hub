name: QA Automation Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      project_id:
        description: 'ID du projet à exécuter (laisser vide pour tous)'
        required: false
        default: ''
      target_env:
        description: 'Environnement cible'
        required: true
        default: 'staging'

jobs:
  test-e2e:
    name: Playwright Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers with Cache
        run: pnpm --filter @qa-hub/playwright-tests exec playwright install --with-deps chromium

      - name: Run E2E Tests
        env:
          CI: true
          PROJECT_ID: ${{ github.event.inputs.project_id }}
          TARGET_ENV: ${{ github.event.inputs.target_env || 'staging' }}
        run: |
          pnpm --filter @qa-hub/playwright-tests exec playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload Test Results Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shardIndex }}
          path: |
            playwright-report/
            artifact/
          retention-days: 14
